<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Order | Smart Canteen</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark"
     style="background:#0b1f3a;">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            🍽️ Smart Canteen
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="menu.html">Menu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="orders.html">My Orders</a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container py-5">

    <div class="text-center mb-4">

        <h2 class="fw-bold">
            Track Your Order
        </h2>

        <p class="text-muted">
            Follow your order status in real time
        </p>

    </div>


    <!-- ORDER DETAILS -->

    <div id="orderDetails"></div>


    <!-- ORDER STATUS -->

    <div id="statusSection" class="mt-4"></div>


    <!-- BUTTONS -->

    <div class="text-center mt-4">

        <a href="orders.html"
           class="btn btn-outline-dark me-2">

            <i class="bi bi-clock-history"></i>
            My Orders

        </a>

        <a href="menu.html"
           class="btn btn-warning">

            <i class="bi bi-cart-plus"></i>
            Order More

        </a>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

let orders =
    JSON.parse(localStorage.getItem("canteenOrders")) || [];


// Get order ID from URL

const params = new URLSearchParams(window.location.search);

const orderId = params.get("id");


// Find order

let order;

if (orderId) {

    order = orders.find(
        item => item.id == orderId
    );

} else {

    // If no ID, show latest order

    order = orders[orders.length - 1];

}


// ================= DISPLAY ORDER =================

function displayOrder() {

    const orderDetails =
        document.getElementById("orderDetails");

    const statusSection =
        document.getElementById("statusSection");


    // No order found

    if (!order) {

        orderDetails.innerHTML = `
            <div class="alert alert-warning text-center">

                <i class="bi bi-exclamation-circle"></i>

                <h5 class="mt-2">
                    No order found
                </h5>

                <p>
                    Please place an order first.
                </p>

                <a href="menu.html"
                   class="btn btn-warning">

                    Go to Menu

                </a>

            </div>
        `;

        return;
    }


    // ================= ORDER ITEMS =================

    let itemsHTML = "";

    order.items.forEach(item => {

        itemsHTML += `
            <div class="d-flex justify-content-between
                        border-bottom py-2">

                <span>
                    ${item.name}
                    × ${item.quantity}
                </span>

                <strong>
                    ₹${item.price * item.quantity}
                </strong>

            </div>
        `;

    });


    orderDetails.innerHTML = `

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <div class="row align-items-center">

                    <div class="col-md-6">

                        <p class="text-muted mb-1">
                            Order Token
                        </p>

                        <h1 class="fw-bold text-warning">
                            ${order.token}
                        </h1>

                    </div>


                    <div class="col-md-6 text-md-end">

                        <p class="text-muted mb-1">
                            Pickup Counter
                        </p>

                        <h5>
                            <i class="bi bi-shop"></i>
                            ${order.counter}
                        </h5>

                    </div>

                </div>


                <hr>


                <h5 class="fw-bold mb-3">
                    Order Items
                </h5>

                ${itemsHTML}


                <div class="d-flex justify-content-between mt-3">

                    <strong>
                        Total Amount
                    </strong>

                    <strong class="text-success">
                        ₹${order.total}
                    </strong>

                </div>

            </div>

        </div>

    `;


    // Display status tracker

    displayStatus();

}


// ================= STATUS TRACKER =================

function displayStatus() {

    const statusSection =
        document.getElementById("statusSection");


    const statuses = [

        "ORDER PLACED",
        "ACCEPTED",
        "PREPARING",
        "READY",
        "COMPLETED"

    ];


    const currentIndex =
        statuses.indexOf(order.status);


    let trackerHTML = `

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h5 class="fw-bold text-center mb-4">

                    Order Status

                </h5>

                <div class="status-tracker">

    `;


    statuses.forEach((status, index) => {

        let activeClass = "";

        let icon = "bi-circle";


        if (index < currentIndex) {

            activeClass = "completed";

            icon = "bi-check-circle-fill";

        }

        else if (index === currentIndex) {

            activeClass = "active";

            icon = "bi-record-circle-fill";

        }


        trackerHTML += `

            <div class="status-step ${activeClass}">

                <div class="status-icon">

                    <i class="bi ${icon}"></i>

                </div>

                <div class="status-name">

                    ${status}

                </div>

            </div>

        `;

    });


    trackerHTML += `

                </div>


                <div class="text-center mt-4">

                    <span class="badge bg-warning text-dark fs-6">

                        ${order.status}

                    </span>

                </div>


            </div>

        </div>

    `;


    statusSection.innerHTML = trackerHTML;

}


displayOrder();

</script>


<!-- ================= TRACKER CSS ================= -->

<style>

.status-tracker {

    display: flex;

    justify-content: space-between;

    position: relative;

    margin: 30px 0;

}


.status-tracker::before {

    content: "";

    position: absolute;

    top: 22px;

    left: 8%;

    right: 8%;

    height: 3px;

    background: #ddd;

    z-index: 0;

}


.status-step {

    position: relative;

    z-index: 1;

    text-align: center;

    width: 20%;

}


.status-icon {

    width: 45px;

    height: 45px;

    margin: auto;

    border-radius: 50%;

    background: #eee;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 20px;

    color: #777;

}


.status-step.active .status-icon {

    background: #ffc107;

    color: #000;

}


.status-step.completed .status-icon {

    background: #198754;

    color: white;

}


.status-name {

    font-size: 12px;

    margin-top: 10px;

    font-weight: 600;

}


@media(max-width: 576px) {

    .status-name {

        font-size: 9px;

    }

    .status-icon {

        width: 35px;

        height: 35px;

        font-size: 16px;

    }

}

</style>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
