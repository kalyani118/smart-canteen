<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | Smart Canteen</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        href="css/style.css"
        rel="stylesheet">


    <style>

        body {
            background: #fffafc;
            font-family: Arial, sans-serif;
        }


        .order-card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 18px rgba(0,0,0,0.08);

        }


        .token {

            font-size: 22px;

            font-weight: bold;

            color: #ff6b00;

        }


        .status {

            display: inline-block;

            padding: 7px 14px;

            border-radius: 20px;

            background: #fff3cd;

            color: #856404;

            font-weight: 600;

            font-size: 14px;

        }


        .item-row {

            padding: 10px 0;

            border-bottom: 1px solid #eee;

        }


        .total {

            font-size: 20px;

            font-weight: bold;

        }


        .empty-box {

            background: white;

            border-radius: 18px;

            padding: 60px 20px;

            text-align: center;

            box-shadow:
                0 4px 18px rgba(0,0,0,0.07);

        }

    </style>

</head>


<body>


<!-- =====================================
     NAVBAR
====================================== -->

<nav class="navbar bg-white shadow-sm">

    <div class="container">


        <a
            href="index.html"
            class="navbar-brand fw-bold">

            🍴 Smart Canteen

        </a>


        <div>

            <a
                href="menu.html"
                class="btn btn-outline-primary me-2">

                <i class="bi bi-shop"></i>

                Menu

            </a>


            <a
                href="cart.html"
                class="btn btn-warning">

                <i class="bi bi-cart"></i>

                Cart

            </a>

        </div>


    </div>

</nav>



<!-- =====================================
     MAIN
====================================== -->

<div class="container py-5">


    <div class="text-center mb-5">

        <h1 class="fw-bold">

            My Orders 📋

        </h1>


        <p class="text-muted">

            View and track your canteen orders

        </p>

    </div>



    <!-- =====================================
         ORDERS CONTAINER
    ====================================== -->

    <div id="ordersContainer">

    </div>


</div>



<script>


// ==========================================
// GET ORDERS
// ==========================================

let orders =

    JSON.parse(
        localStorage.getItem("canteenOrders")
    ) || [];



// ==========================================
// DISPLAY ORDERS
// ==========================================

function displayOrders() {


    const container =

        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML = "";



    // NO ORDERS

    if (orders.length === 0) {


        container.innerHTML = `

            <div class="empty-box">

                <i
                    class="
                    bi
                    bi-receipt
                    fs-1
                    text-muted
                    ">
                </i>


                <h3 class="mt-3">

                    No Orders Yet

                </h3>


                <p class="text-muted">

                    You haven't placed any orders yet.

                </p>


                <a
                    href="menu.html"
                    class="btn btn-warning">

                    Browse Menu

                </a>

            </div>

        `;


        return;

    }



    // ======================================
    // SHOW ORDERS
    // ======================================

    orders
        .slice()
        .reverse()
        .forEach(function(order) {


            // FOOD ITEMS

            let itemsHTML = "";


            order.items.forEach(function(item) {


                itemsHTML += `

                    <div
                        class="
                        item-row
                        d-flex
                        justify-content-between
                        ">

                        <span>

                            ${item.name}

                            × ${item.quantity}

                        </span>


                        <strong>

                            ₹${item.price * item.quantity}

                        </strong>

                    </div>

                `;

            });



            // ORDER CARD

            container.innerHTML += `

                <div class="order-card">


                    <!-- =========================
                         PART 1 : ORDER DETAILS
                    ========================== -->

                    <div class="row mb-4">


                        <div class="col-md-7">

                            <p
                                class="
                                text-muted
                                mb-1
                                ">

                                Order Token

                            </p>


                            <div class="token">

                                🎟️ ${order.token}

                            </div>


                            <p class="mt-3 mb-1">

                                <strong>
                                    Student:
                                </strong>

                                ${order.studentName || "N/A"}

                            </p>


                            <p class="mb-1">

                                <strong>
                                    Student ID:
                                </strong>

                                ${order.studentId || "N/A"}

                            </p>


                            <p class="mb-1">

                                <strong>
                                    Pickup Counter:
                                </strong>

                                ${order.counter || "N/A"}

                            </p>


                            <p class="mb-0">

                                <strong>
                                    Payment:
                                </strong>

                                ${order.payment || "N/A"}

                            </p>

                        </div>



                        <!-- DATE -->

                        <div class="col-md-5 text-md-end">


                            <span class="status">

                                ${order.status || "ORDER PLACED"}

                            </span>


                            <p
                                class="
                                text-muted
                                mt-3
                                ">

                                ${order.date || ""}

                            </p>


                        </div>


                    </div>



                    <!-- =========================
                         PART 2 : FOOD ITEMS
                    ========================== -->

                    <div class="mb-4">


                        <h5 class="fw-bold mb-3">

                            🍔 Ordered Items

                        </h5>


                        ${itemsHTML}


                        <div
                            class="
                            d-flex
                            justify-content-between
                            mt-3
                            ">


                            <span
                                class="total">

                                Total

                            </span>


                            <span
                                class="total">

                                ₹${order.total}

                            </span>


                        </div>


                    </div>



                    <!-- =========================
                         PART 3 : TRACK ORDER
                    ========================== -->

                    <div
                        class="
                        d-flex
                        justify-content-between
                        align-items-center
                        flex-wrap
                        gap-2
                        ">


                        <div>

                            <strong>

                                Current Status:

                            </strong>


                            <span class="status">

                                ${order.status || "ORDER PLACED"}

                            </span>

                        </div>


                        <a

                            href="track-order.html?id=${order.id}"

                            class="btn btn-warning">

                            <i
                                class="bi bi-geo-alt">
                            </i>

                            Track Order

                        </a>


                    </div>


                </div>

            `;

        });

}



// ==========================================
// LOAD ORDERS
// ==========================================

displayOrders();


</script>


</body>

</html>
